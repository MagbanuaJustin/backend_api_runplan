name: CI

# What this catches, and why each step is here:
#   - lint       : a syntax error in a model that no route touches still ships
#   - tests      : the plan generator's date and distance rules, plus the
#                  architecture rules (no SQL in controllers, routes resolve,
#                  no secret ever returned by the integrations endpoint)
#   no composer step: this project vendors LavaLust and has no vendor/, and the
#   test runner is dependency-free on purpose so CI and `./scripts/check.sh`
#   check exactly the same thing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint and test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.3 is what the Dockerfile deploys; 8.2 is the floor to catch a
        # feature that only exists on one of them.
        php: ['8.3', '8.2']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Same extensions the Dockerfile installs, plus what the tests need.
          extensions: pdo_mysql, curl, json, mbstring
          coverage: none

      - name: Show runtime
        run: php -v

      - name: Lint and test
        run: bash ./scripts/check.sh

      - name: Confirm no secrets were committed
        # .env must never appear, nor any private key. Note that
        # app/config/certs/aiven-ca.pem IS allowed: a CA certificate is public
        # by definition and committing it is how the container verifies Aiven.
        # What must never be committed is the *private* half of a key pair.
        run: |
          set -e
          hits="$(git ls-files | grep -E '(^|/)\.env$|\.(key|p12|pfx)$|id_rsa|service-account' || true)"
          if [ -n "$hits" ]; then
            echo "Refusing: a credential-bearing file is tracked:"
            echo "$hits"
            exit 1
          fi
          if git ls-files | grep -qx 'app/config/certs/aiven-ca.pem'; then
            head -1 app/config/certs/aiven-ca.pem | grep -q 'BEGIN CERTIFICATE' \
              || { echo "certs/aiven-ca.pem is not a public certificate"; exit 1; }
          fi
          echo "ok: no .env or private key material tracked"
